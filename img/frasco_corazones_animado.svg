<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="400">
  <style>
    /* Estilos base del trazo */
    .jar-stroke {
      fill: none;
      stroke: #8C733E;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* Animación de la tapa */
    .lid {
      animation: open-lid 3s infinite alternate ease-in-out;
      transform-origin: 200px 100px;
    }

    @keyframes open-lid {
      0% {
        transform: translate(0, 20px) rotate(0deg);
      }
      100% {
        transform: translate(30px, -35px) rotate(25deg);
      }
    }

    /* Animación de corazones que salen */
    .heart-float {
      animation: float-up 3s infinite ease-out;
      transform-origin: center;
    }

    .heart-1 { animation-delay: 0s; }
    .heart-2 { animation-delay: 1s; }
    .heart-3 { animation-delay: 2s; }

    @keyframes float-up {
      0% {
        transform: translate(0, 80px) scale(0.3);
        opacity: 0;
      }
      40% {
        opacity: 1;
      }
      100% {
        transform: translate(-40px, -80px) scale(1.1);
        opacity: 0;
      }
    }
  </style>

  <!-- Corazones animados saliendo del frasco -->
  <g class="heart-float heart-1">
    <path d="M 130,110 C 130,100 115,90 105,105 C 95,90 80,100 80,110 C 80,125 105,140 105,140 C 105,140 130,125 130,110 Z" fill="none" stroke="#8C733E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g class="heart-float heart-2">
    <path d="M 140,120 C 140,110 125,100 115,115 C 105,100 90,110 90,120 C 90,135 115,150 115,150 C 115,150 140,135 140,120 Z" fill="none" stroke="#8C733E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g class="heart-float heart-3">
    <path d="M 135,115 C 135,105 120,95 110,110 C 100,95 85,105 85,115 C 85,130 110,145 110,145 C 110,145 135,130 135,115 Z" fill="none" stroke="#8C733E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tapa del Frasco (Animada) -->
  <g class="lid">
    <rect x="160" y="80" width="100" height="28" rx="14" class="jar-stroke" transform="rotate(-20, 210, 94)" />
  </g>

  <!-- Cuerpo del Frasco y contenido fijo -->
  <g>
    <!-- Boca / Cuello del frasco -->
    <path d="M 100 125 C 100 115, 200 115, 200 125" class="jar-stroke" />
    <path d="M 90 140 L 210 140" class="jar-stroke" />

    <!-- Contorno del frasco -->
    <path d="M 90,140 
             C 65,170 65,200 65,220 
             L 65,330 
             C 65,365 235,365 235,330 
             L 235,220 
             C 235,200 235,170 210,140" 
          class="jar-stroke" />

    <!-- Corazones y destellos dentro del frasco -->
    <!-- Corazón grande centro-arriba -->
    <path d="M 160,210 C 160,195 140,185 125,200 C 110,185 90,195 90,210 C 90,230 125,250 125,250 C 125,250 160,230 160,210 Z" class="jar-stroke" stroke-width="8" />

    <!-- Corazón abajo izquierda -->
    <path d="M 125,285 C 125,272 108,265 95,278 C 82,265 65,272 65,285 C 65,302 95,318 95,318 C 95,318 125,302 125,285 Z" class="jar-stroke" stroke-width="7" />

    <!-- Corazón abajo derecha -->
    <path d="M 210,265 C 210,250 190,240 175,255 C 160,240 140,250 140,265 C 140,285 175,305 175,305 C 175,305 210,285 210,265 Z" class="jar-stroke" stroke-width="8" />

    <!-- Círculos/Burbujas internas -->
    <circle cx="185" cy="215" r="12" class="jar-stroke" stroke-width="7" />
    <circle cx="140" cy="335" r="10" class="jar-stroke" stroke-width="7" />
  </g>
</svg>
